name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPU wheels keep CI light.
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.0"

      - name: Provision matrix Python
        run: |
          uv python install "${{ matrix.python-version }}"
          uv venv --seed --python "${{ matrix.python-version }}" .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      - name: Install torch CPU wheels
        run: |
          python -m pip install --upgrade pip
          # torchvision is installed here too, from the same CPU index, and
          # pinned to land alongside torch. `spikeforge` (installed next)
          # depends on `torchvision>=0.20` with no index constraint of its
          # own; if we let that resolve it later it silently pulls a CUDA
          # build from PyPI that is ABI-incompatible with the CPU torch
          # already on disk, and every import of spikeforge_targets blows up
          # with "operator torchvision::nms does not exist" at collection
          # time. Installing the matching CPU build up front makes the later
          # resolution a no-op.
          pip install torch torchvision --index-url ${{ env.TORCH_INDEX_URL }}

      - name: Install the core dependency
        run: |
          # The core repository is public; the fallback needs no credentials.
          pip install "spikeforge~=0.3.0" \
            || pip install "git+https://github.com/Capsize-Games/spikeforge.git@main#subdirectory=packages/spikeforge"

      - name: Install spikeforge-targets
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest
